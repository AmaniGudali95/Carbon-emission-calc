spring:
  application:
    name: farm-carbon-service

  datasource:
    url: jdbc:h2:mem:farmcarbon;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: farm-carbon-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.farmcarbon.event
    producer:
      properties:
        spring.json.add.type.headers: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
carbon-interface:
  base-url: https://www.carboninterface.com/api/v1
  api-key: ${CARBON_INTERFACE_API_KEY:}

app:
  kafka:
    topic:
      activity-logged: activity-logged
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/farmcarbon
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect