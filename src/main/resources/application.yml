spring:
  application:
    name: farm-carbon-service
  datasource:
    url: jdbc:h2:mem:farmcarbon;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: farm-carbon-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.farmcarbon.event
    producer:
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 86400000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
farmbeats:
  base-url: http://localhost:8000
carbon-interface:
  base-url: https://www.carboninterface.com/api/v1
  api-key: ${CARBON_INTERFACE_API_KEY:}
electricity-maps:
  base-url: https://api.electricitymaps.org/v3
  api-key: ${ELECTRICITY_MAPS_API_KEY:}
  zone: US-UT
server:
  compression:
    enabled: true
app:
  kafka:
    topic:
      activity-logged: activity-logged
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/farmcarbon
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect